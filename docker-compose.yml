services:
  # Service Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain_scan_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: always

  # Service Frontend (Streamlit)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain_scan_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    command: python -m streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0
    restart: always